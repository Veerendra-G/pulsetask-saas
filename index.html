    // Google Brand SVG Icon
    const GoogleIcon = ({ className = "w-5 h-5" }) => (

        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />

    );

    // Facebook Brand SVG Icon
    const FacebookIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="#1877F2">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>

    // Twitter Brand SVG Icon
    const TwitterIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="#1DA1F2">
        <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.936 9.936 0 0024 4.59z"/>
      </svg>
    );

    // --- INITIAL SEED TASKS FOR PROFESSIONAL SAAS DEMO ---
    const INITIAL_TASKS = [
      {
        id: "task-1",
        title: "Deploy Q4 Infrastructure on AWS ECS Cluster",
        description: "Configure autoscaling policies, target groups, and CloudWatch alert triggers for high-traffic peak.",

      {

        status: "in_progress",

        tags: ["Payments", "Backend"],

      },
      {
        id: "task-4",
        title: "Launch Black Friday SaaS Growth Email Campaign",
        description: "Set up behavioral drip sequence in Customer.io with A/B subject line testing.",
        status: "todo",
        priority: "medium",
        project: "Marketing",
        dueDate: "2026-11-28",
        tags: ["Growth", "Email"],
        createdAt: "2026-11-22"
      },
      {
        id: "task-5",
        title: "Security Audit & OAuth2 Token Refresh Verification",
        description: "Review JWT expiry rotation, CSRF guards, and conduct automated static dependency scanning.",
        status: "review",
        priority: "high",
        project: "Security",
        dueDate: "2026-11-24",
        tags: ["Auth", "Security"],
        createdAt: "2026-11-19"
      },
      {
        id: "task-6",
        title: "Prepare Monthly Investor Update & MRR Metrics Deck",
        description: "Aggregate Net Revenue Retention, CAC payback, and product roadmap milestones.",
        status: "todo",
        priority: "low",
        project: "Executive",
        dueDate: "2026-11-30",
        tags: ["Finance", "Metrics"],
        createdAt: "2026-11-22"
      }
    ];

    const PROJECTS = [
      { name: "All Projects", color: "bg-slate-500" },
      { name: "Engineering", color: "bg-indigo-500" },
      { name: "Design", color: "bg-pink-500" },
      { name: "Marketing", color: "bg-amber-500" },
      { name: "Security", color: "bg-red-500" },
      { name: "Executive", color: "bg-emerald-500" }
    ];

    const STATUS_COLUMNS = [
      { id: "todo", title: "Backlog / To Do", color: "border-slate-300 dark:border-slate-700", badge: "bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300" },
      { id: "in_progress", title: "In Progress", color: "border-indigo-400 dark:border-indigo-600", badge: "bg-indigo-50 text-indigo-700 dark:bg-indigo-950/50 dark:text-indigo-300" },
      { id: "review", title: "In Review", color: "border-amber-400 dark:border-amber-600", badge: "bg-amber-50 text-amber-700 dark:bg-amber-950/50 dark:text-amber-300" },
      { id: "completed", title: "Completed", color: "border-emerald-400 dark:border-emerald-600", badge: "bg-emerald-50 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-300" }
    ];

    const PRIORITIES = {
      urgent: { label: "Urgent", color: "text-red-600 bg-red-50 border-red-200 dark:bg-red-950/40 dark:text-red-400 dark:border-red-900/60" },
      high: { label: "High", color: "text-amber-600 bg-amber-50 border-amber-200 dark:bg-amber-950/40 dark:text-amber-400 dark:border-amber-900/60" },
      medium: { label: "Medium", color: "text-blue-600 bg-blue-50 border-blue-200 dark:bg-blue-950/40 dark:text-blue-400 dark:border-blue-900/60" },
      low: { label: "Low", color: "text-slate-600 bg-slate-50 border-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:border-slate-700" }
    };

    // --- MAIN APPLICATION COMPONENT ---
    const API_BASE = window.location.protocol === 'file:' 
      ? "http://localhost:8000/api" 
      : "/api";

    function App() {
      // User Authentication State
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const cached = localStorage.getItem("pulsetask_user");
          return cached ? JSON.parse(cached) : null;
        } catch {
          return null;
        }
      });
      const [authToken, setAuthToken] = useState(() => localStorage.getItem("pulsetask_token") || "");
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState("login"); // 'login' | 'register'

      // Helper for authenticated requests
      const getAuthHeaders = (tokenOverride) => {
        const token = tokenOverride !== undefined ? tokenOverride : (localStorage.getItem("pulsetask_token") || authToken);
        const headers = { "Content-Type": "application/json" };
        if (token) {
          headers["Authorization"] = `Bearer ${token}`;
        }
        return headers;
      };

      // LocalStorage & Neon Database State
      const [tasks, setTasks] = useState(() => {
        try {
          const cached = localStorage.getItem("pulsetask_tasks_v2");
          return cached ? JSON.parse(cached) : INITIAL_TASKS;
        } catch {
          return INITIAL_TASKS;
        }
      });

      const [dbStatus, setDbStatus] = useState("checking"); // 'connected' | 'offline' | 'checking'

      const [isDarkMode, setIsDarkMode] = useState(() => {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      });

      // Filter & UI States
      const [activeView, setActiveView] = useState("list");
      const [selectedNav, setSelectedNav] = useState("all");
      const [selectedProject, setSelectedProject] = useState("All Projects");
      const [priorityFilter, setPriorityFilter] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");
      const [sortBy, setSortBy] = useState("dueDate");
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingTask, setEditingTask] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      // Check Backend & Fetch from Neon Database
      const fetchNeonData = async (tokenOverride) => {
        const activeToken = tokenOverride !== undefined ? tokenOverride : (localStorage.getItem("pulsetask_token") || authToken);
        try {
          const res = await fetch(`${API_BASE}/tasks`, {
            headers: getAuthHeaders(tokenOverride)
          });
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data)) {
              if (activeToken) {
                // When signed in: Strictly show ONLY the authenticated user's tasks
                setTasks(data);
              } else {
                // When in Guest mode: show public demo tasks
                if (data.length > 0) {
                  setTasks(data);
                } else {
                  for (const item of INITIAL_TASKS) {
                    await fetch(`${API_BASE}/tasks`, {
                      method: 'POST',
                      headers: getAuthHeaders(tokenOverride),
                      body: JSON.stringify(item),
                    });
                  }
                  setTasks(INITIAL_TASKS);
                }
              }
            }
            setDbStatus("connected");
          } else {
            setDbStatus("offline");
          }
        } catch {
          setDbStatus("offline");
        }
      };

      useEffect(() => {
        fetchNeonData();
      }, []);

      const handleAuthSuccess = (data) => {
        localStorage.setItem("pulsetask_token", data.token);
        localStorage.setItem("pulsetask_user", JSON.stringify(data.user));
        setAuthToken(data.token);
        setCurrentUser(data.user);
        fetchNeonData(data.token);
        showToast(`Welcome back, ${data.user.name || data.user.email}!`);
      };

      const handleLogout = () => {
        localStorage.removeItem("pulsetask_token");
        localStorage.removeItem("pulsetask_user");
        setAuthToken("");
        setCurrentUser(null);
        fetchNeonData("");
        showToast("Signed out. Switched to Public Demo Mode.");
      };

      // Save to localStorage as backup
      useEffect(() => {
        try {
          localStorage.setItem("pulsetask_tasks_v2", JSON.stringify(tasks));
        } catch (e) {
          console.error("Failed to save tasks", e);
        }
      }, [tasks]);

      // Apply Dark Mode class to <html>
      useEffect(() => {
        if (isDarkMode) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      }, [isDarkMode]);

      // Toast notification helper
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Task actions with Neon Database Sync
      const handleToggleComplete = async (id) => {
        const currentTask = tasks.find(t => t.id === id);
        if (!currentTask) return;
        const nextStatus = currentTask.status === "completed" ? "todo" : "completed";

        if (nextStatus === "completed" && typeof confetti === "function") {
          confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
        }

        setTasks(prev => prev.map(t => t.id === id ? { ...t, status: nextStatus } : t));

        if (dbStatus === "connected") {
          try {
            await fetch(`${API_BASE}/tasks/${id}`, {
              method: "PUT",
              headers: getAuthHeaders(),
              body: JSON.stringify({ status: nextStatus }),
            });
          } catch (e) {
            console.error("DB update error", e);
          }
        }
      };

      const handleSaveTask = async (taskData) => {
        if (editingTask && editingTask.id) {
          setTasks(prev => prev.map(t => t.id === editingTask.id ? { ...t, ...taskData } : t));
          showToast("Task updated");

          if (dbStatus === "connected") {
            try {
              await fetch(`${API_BASE}/tasks/${editingTask.id}`, {
                method: "PUT",
                headers: getAuthHeaders(),
                body: JSON.stringify(taskData),
              });
            } catch (e) {
              console.error("DB update error", e);
            }
          }
        } else {
          const newTask = {
            id: "task-" + Date.now(),
            ...taskData,
            createdAt: new Date().toISOString().split("T")[0]
          };
          setTasks(prev => [newTask, ...prev]);
          showToast("Task created in Neon DB");

          if (dbStatus === "connected") {
            try {
              await fetch(`${API_BASE}/tasks`, {
                method: "POST",
                headers: getAuthHeaders(),
                body: JSON.stringify(newTask),
              });
            } catch (e) {
              console.error("DB insert error", e);
            }
          }
        }
        setIsModalOpen(false);
        setEditingTask(null);
      };

      const handleDeleteTask = async (id) => {
        const deleted = tasks.find(t => t.id === id);
        setTasks(prev => prev.filter(t => t.id !== id));
        showToast(`Deleted "${deleted?.title?.slice(0, 20)}..."`);

        if (dbStatus === "connected") {
          try {
            await fetch(`${API_BASE}/tasks/${id}`, {
              method: "DELETE",
              headers: getAuthHeaders()
            });
          } catch (e) {
            console.error("DB delete error", e);
          }
        }
      };

      const handleStatusChange = async (id, newStatus) => {
        setTasks(prev => prev.map(t => t.id === id ? { ...t, status: newStatus } : t));

        if (dbStatus === "connected") {
          try {
            await fetch(`${API_BASE}/tasks/${id}`, {
              method: "PUT",
              headers: getAuthHeaders(),
              body: JSON.stringify({ status: newStatus }),
            });
          } catch (e) {
            console.error("DB update error", e);
          }
        }
      };

      const handleClearCompleted = async () => {
        if (window.confirm("Clear all completed tasks from Neon DB?")) {
          setTasks(prev => prev.filter(t => t.status !== "completed"));
          showToast("Cleared completed tasks");

          if (dbStatus === "connected") {
            try {
              await fetch(`${API_BASE}/tasks-clear/completed`, {
                method: "DELETE",
                headers: getAuthHeaders()
              });
            } catch (e) {
              console.error("DB clear error", e);
            }
          }
        }
      };

      // Export to JSON
      const handleExportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
        const downloadAnchor = document.createElement("a");
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `pulsetask-backup-${new Date().toISOString().split("T")[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast("Exported tasks to JSON");
      };

      // Filtered Tasks calculation
      const filteredTasks = useMemo(() => {
        const todayStr = new Date().toISOString().split("T")[0];

        return tasks.filter(task => {
          // Navigation filter
          if (selectedNav === "today" && task.dueDate !== todayStr) return false;
          if (selectedNav === "upcoming" && (!task.dueDate || task.dueDate <= todayStr)) return false;
          if (selectedNav === "completed" && task.status !== "completed") return false;

          // Project filter
          if (selectedProject !== "All Projects" && task.project !== selectedProject) return false;

          // Priority filter
          if (priorityFilter !== "all" && task.priority !== priorityFilter) return false;

          // Search query
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = task.title.toLowerCase().includes(q);
            const matchDesc = task.description.toLowerCase().includes(q);
            const matchTag = task.tags?.some(tag => tag.toLowerCase().includes(q));
            if (!matchTitle && !matchDesc && !matchTag) return false;
          }

          return true;
        }).sort((a, b) => {
          if (sortBy === "dueDate") {
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate);
          }
          if (sortBy === "priority") {
            const weights = { urgent: 4, high: 3, medium: 2, low: 1 };
            return (weights[b.priority] || 0) - (weights[a.priority] || 0);
          }
          if (sortBy === "title") {
            return a.title.localeCompare(b.title);
          }
          return b.createdAt.localeCompare(a.createdAt);
        });
      }, [tasks, selectedNav, selectedProject, priorityFilter, searchQuery, sortBy]);

      // Quick KPI Stats
      const stats = useMemo(() => {
        const total = tasks.length;
        const completed = tasks.filter(t => t.status === "completed").length;
        const inProgress = tasks.filter(t => t.status === "in_progress").length;
        const todo = tasks.filter(t => t.status === "todo").length;
        const todayStr = new Date().toISOString().split("T")[0];
        const overdue = tasks.filter(t => t.status !== "completed" && t.dueDate && t.dueDate < todayStr).length;
        const rate = total === 0 ? 0 : Math.round((completed / total) * 100);

        return { total, completed, inProgress, todo, overdue, rate };
      }, [tasks]);

      // MANDATORY LOGIN GATE: If user is not logged in, show login card directly!

    // --- AUTH MODAL (LOGIN & REGISTRATION WITH GOOGLE) ---
    function AuthModal({ isOpen, onClose, onAuthSuccess, initialMode = "login", isMandatory = false }) {
      const [mode, setMode] = useState(initialMode); // 'login' | 'register'
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [confirmPassword, setConfirmPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      useEffect(() => {
        setMode(initialMode === "google" ? "login" : initialMode);
        setError(null);
      }, [initialMode, isOpen]);

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError(null);

        if (mode === "register" && password !== confirmPassword) {
          setError("Passwords do not match. Please re-enter.");
          return;
        }

        setLoading(true);
        const endpoint = mode === "login" ? `${API_BASE}/auth/login` : `${API_BASE}/auth/register`;
        const cleanName = email.split("@")[0].replace(/[._-]/g, " ").replace(/\b\w/g, c => c.toUpperCase());
        const payload = mode === "login" 
          ? { email: email.trim(), password }
          : { email: email.trim(), password, name: cleanName };

        try {
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || "Authentication failed. Check your credentials.");
          }
          onAuthSuccess(data);
          if (!isMandatory && onClose) onClose();
        } catch (err) {
          setError(err.message || "An unexpected error occurred");
        } finally {
          setLoading(false);
        }
      };

      const handleSocialAuth = async (provider = "google") => {
        setError(null);

        let socialEmail = email.trim();
        if (!socialEmail) {
          const promptInput = window.prompt("Enter your Google Account email to sign in:");
          if (!promptInput || !promptInput.trim() || !promptInput.includes("@")) {
            return;
          }
          socialEmail = promptInput.trim();
        }

        setLoading(true);
        const cleanSocialName = socialEmail.split("@")[0].replace(/[._-]/g, " ").replace(/\b\w/g, c => c.toUpperCase());

        try {
          const res = await fetch(`${API_BASE}/auth/social`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              provider,
              email: socialEmail,
              name: cleanSocialName
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Google sign in failed");
          onAuthSuccess(data);
          if (!isMandatory && onClose) onClose();
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const card = (
        <div className="relative bg-white dark:bg-[#111827] w-full max-w-[400px] rounded-3xl border border-slate-200/90 dark:border-slate-800 shadow-2xl p-8 pt-7">
          
          {/* Close Button (only when optional modal) */}
          {!isMandatory && (
            <button 
              onClick={onClose} 
              className="absolute top-5 right-5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
            >
              <Icon name="close" className="w-4 h-4" />
            </button>
          )}

          {/* Title - exactly as in design */}
          <h2 className="text-2xl font-bold text-slate-800 dark:text-white mb-6">
            {mode === "login" ? "Login to your Account" : "Create your Account"}
          </h2>

          {/* Error Banner */}
          {error && (
            <div className="mb-4 p-3 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/60 rounded-xl text-red-600 dark:text-red-400 text-xs">
              ⚠️ {error}
            </div>
          )}

          {/* Form */}
          <form onSubmit={handleSubmit} className="space-y-4">
            <div>
              <input
                type="email"
                required
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="Email"
                className="w-full text-sm px-4 py-3.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/60 text-slate-900 dark:text-white placeholder-slate-400 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 dark:focus:ring-blue-900/40 shadow-sm transition-all"
              />
            </div>

            <div>
              <input
                type="password"
                required
                minLength={6}
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                placeholder="Password"
                className="w-full text-sm px-4 py-3.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/60 text-slate-900 dark:text-white placeholder-slate-400 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 dark:focus:ring-blue-900/40 shadow-sm transition-all"
              />
            </div>

            {mode === "register" && (
              <div>
                <input
                  type="password"
                  required
                  minLength={6}
                  value={confirmPassword}
                  onChange={(e) => setConfirmPassword(e.target.value)}
                  placeholder="Confirm Password"
                  className="w-full text-sm px-4 py-3.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/60 text-slate-900 dark:text-white placeholder-slate-400 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 dark:focus:ring-blue-900/40 shadow-sm transition-all"
                />
              </div>
            )}

            {/* Deep Blue Sign in / Sign up Button */}
            <button
              type="submit"
              disabled={loading}
              className="w-full py-3.5 px-4 bg-[#1e3a8a] hover:bg-[#172554] text-white text-sm font-semibold rounded-xl shadow-lg shadow-blue-900/20 transition-all transform active:scale-[0.98] disabled:opacity-50 mt-2"
            >
              {loading ? "Please wait..." : mode === "login" ? "Sign in" : "Sign up"}
            </button>
          </form>

          {/* Divider */}
          <div className="text-center text-xs text-slate-400 my-5 font-normal">
            - Or {mode === "login" ? "sign in" : "sign up"} with -
          </div>

          {/* Social Login: Only Google */}
          <div className="flex items-center justify-center">
            <button
              type="button"
              onClick={() => handleSocialAuth("google")}
              disabled={loading}
              title="Sign in with Google"
              className="w-16 h-12 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md hover:border-slate-300 dark:hover:border-slate-600 flex items-center justify-center transition-all transform active:scale-95 group"
            >
              <GoogleIcon className="w-5 h-5 transition-transform group-hover:scale-110" />
            </button>
          </div>

          {/* Bottom Toggle */}
          <div className="text-center text-xs text-slate-500 dark:text-slate-400 mt-6">
            {mode === "login" ? (
              <span>
                Don't have an account?{" "}
                <button
                  type="button"
                  onClick={() => { setMode("register"); setError(null); }}
                  className="text-blue-700 dark:text-blue-400 font-semibold hover:underline ml-1"
                >
                  Sign up
                </button>
              </span>
            ) : (
              <span>
                Already have an account?{" "}
                <button
                  type="button"
                  onClick={() => { setMode("login"); setError(null); }}
                  className="text-blue-700 dark:text-blue-400 font-semibold hover:underline ml-1"
                >
                  Sign in
                </button>
              </span>
            )}
          </div>

        </div>
      );

      if (isMandatory) {
        return card;
      }

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm animate-fadeIn">
          {card}
        </div>
      );
    }

    // Render the React Application
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
